<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4a300" />
  <title>ApiLog: dziennik pasieki</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/static/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <span class="logo">🐝</span>
    <h1 id="title">ApiLog</h1>
    <button id="langToggle" class="lang-toggle" title="Język / Language">PL</button>
    <span id="netBadge" class="net-badge">online</span>
  </header>

  <main id="view"><!-- views are drawn by app.js --></main>

  <nav class="tabs">
    <button data-tab="hives" class="active"><span class="ic">🍯</span><span data-i18n="tab_hives">Ule</span></button>
    <button data-tab="alerts"><span class="ic">🔔</span><span data-i18n="tab_alerts">Uwagi</span></button>
    <button data-tab="apiaries"><span class="ic">📍</span><span data-i18n="tab_apiaries">Pasieki</span></button>
    <button data-tab="knowledge"><span class="ic">📖</span><span data-i18n="tab_knowledge">Wiedza</span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="/static/i18n.js"></script>
  <script src="/static/knowledge.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
